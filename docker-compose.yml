x-backend-env: &backend-env
  ENVIRONMENT: ${ENVIRONMENT:-production}
  SECRET_KEY: ${SECRET_KEY}
  DB_NAME: ${DB_NAME:-open-wearables}
  DB_USER: ${DB_USER:-open-wearables}
  DB_PASSWORD: ${DB_PASSWORD}
  DB_PORT: ${DB_PORT:-5432}
  REDIS_PORT: ${REDIS_PORT:-6379}
  REDIS_DB: ${REDIS_DB:-0}
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  API_PORT: ${API_PORT:-8000}
  API_BASE_URL: ${API_BASE_URL}
  FRONTEND_URL: ${FRONTEND_URL}
  CORS_ORIGINS: ${CORS_ORIGINS}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-onboarding@resend.dev}
  EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-NaturTrak Wearables}
  SENTRY_ENABLED: ${SENTRY_ENABLED:-false}
  SENTRY_DSN: ${SENTRY_DSN:-}
  SENTRY_ENV: ${SENTRY_ENV:-production}
  SENTRY_SAMPLES_RATE: ${SENTRY_SAMPLES_RATE:-0.5}
  ADMIN_EMAIL: ${ADMIN_EMAIL}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD}
  AWS_BUCKET_NAME: ${AWS_BUCKET_NAME:-}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
  AWS_REGION: ${AWS_REGION:-eu-central-1}
  SYNC_INTERVAL_SECONDS: ${SYNC_INTERVAL_SECONDS:-3600}
  SLEEP_SCORE_INTERVAL_SECONDS: ${SLEEP_SCORE_INTERVAL_SECONDS:-600}
  RESILIENCE_SCORE_INTERVAL_SECONDS: ${RESILIENCE_SCORE_INTERVAL_SECONDS:-600}
  HISTORICAL_SYNC_ON_CONNECT: ${HISTORICAL_SYNC_ON_CONNECT:-true}
  SVIX_SERVER_URL: ${SVIX_SERVER_URL:-http://svix-server:8071}
  GARMIN_CLIENT_ID: ${GARMIN_CLIENT_ID:-}
  GARMIN_CLIENT_SECRET: ${GARMIN_CLIENT_SECRET:-}
  SUUNTO_CLIENT_ID: ${SUUNTO_CLIENT_ID:-}
  SUUNTO_CLIENT_SECRET: ${SUUNTO_CLIENT_SECRET:-}
  SUUNTO_SUBSCRIPTION_KEY: ${SUUNTO_SUBSCRIPTION_KEY:-}
  POLAR_CLIENT_ID: ${POLAR_CLIENT_ID:-}
  POLAR_CLIENT_SECRET: ${POLAR_CLIENT_SECRET:-}
  OUTGOING_WEBHOOKS_ENABLED: ${OUTGOING_WEBHOOKS_ENABLED:-true}

services:
  db:
    image: postgres:18
    container_name: postgres__open-wearables
    environment:
      POSTGRES_DB: open-wearables
      POSTGRES_USER: open-wearables
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U open-wearables -d open-wearables"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./backend/scripts/init/create-svix-db.sql:/docker-entrypoint-initdb.d/create-svix-db.sql:ro
    restart: unless-stopped

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend__open-wearables
    image: open-wearables-platform:latest
    pull_policy: never
    command: scripts/start/app.sh
    environment:
      <<: *backend-env
      DB_HOST: db
      REDIS_HOST: redis
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  celery-worker:
    container_name: celery-worker__open-wearables
    image: open-wearables-platform:latest
    pull_policy: never
    command: scripts/start/worker.sh
    environment:
      <<: *backend-env
      DB_HOST: db
      REDIS_HOST: redis
    depends_on:
      - redis
      - db
      - app
    restart: unless-stopped

  celery-beat:
    container_name: celery-beat__open-wearables
    image: open-wearables-platform:latest
    pull_policy: never
    command: scripts/start/beat.sh
    environment:
      <<: *backend-env
      DB_HOST: db
      REDIS_HOST: redis
    depends_on:
      - redis
      - db
      - app
    restart: unless-stopped

  flower:
    container_name: flower__open-wearables
    image: open-wearables-platform:latest
    pull_policy: never
    command: scripts/start/flower.sh
    environment:
      <<: *backend-env
      DB_HOST: db
      REDIS_HOST: redis
    depends_on:
      - redis
      - db
      - app
    restart: unless-stopped

  redis:
    container_name: redis__open-wearables
    image: redis:8
    entrypoint:
      - sh
      - -c
      - |
        if [ ! -d /data/appendonlydir ] && [ -f /data/dump.rdb ]; then
          redis-server --daemonize no &
          RPID=$$!
          until redis-cli ping >/dev/null 2>&1; do sleep 0.2; done
          redis-cli CONFIG SET appendonly yes
          sleep 1
          until redis-cli INFO persistence | grep -q 'aof_rewrite_in_progress:0'; do sleep 0.2; done
          redis-cli SHUTDOWN NOSAVE
          wait "$$RPID" 2>/dev/null
        fi
        exec redis-server --appendonly yes --appendfsync everysec
    volumes:
      - redis_data:/data
    restart: unless-stopped

  svix-server:
    container_name: svix-server__open-wearables
    image: svix/svix-server:v1
    entrypoint:
      - sh
      - -c
      - |
        : "$${SVIX_JWT_SECRET:=$$SECRET_KEY}"
        export SVIX_JWT_SECRET
        exec svix-server "$$@"
      - --
    command: ["--run-migrations"]
    environment:
      <<: *backend-env
      SVIX_DB_DSN: "postgresql://${DB_USER:-open-wearables}:${DB_PASSWORD}@db:5432/svix"
      SVIX_QUEUE_TYPE: "redis"
      SVIX_REDIS_DSN: "redis://redis:6379/1"
      SVIX_CACHE_TYPE: "redis"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "svix-server", "healthcheck", "http://localhost:8071"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: frontend__open-wearables
    image: open-wearables-frontend:latest
    pull_policy: never
    expose:
      - "3000"
    depends_on:
      - app
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
